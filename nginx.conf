server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check target for the Docker HEALTHCHECK.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Focus sync + export service, proxied so the browser talks to it
    # same-origin — no CORS preflight on every sync, and no server URL to
    # configure per device.
    #
    # The upstream is deliberately held in a *variable*. nginx resolves a
    # literal proxy_pass hostname once at startup and refuses to start if it
    # can't, which would make the api container a hard requirement for
    # serving the frontend at all. Through a variable it resolves per request
    # via Docker's embedded DNS, so running the frontend alone still works —
    # /api just returns 502, which the client already treats as "offline".
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $focus_api "http://api:8081";
        proxy_pass $focus_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        # Exports of a long history can be a few MB; don't buffer them to disk.
        proxy_buffering off;
    }

    # Hashed build assets (Vite's default dist/assets/*) are immutable — cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every other path serves index.html and React Router
    # takes over client-side. index.html itself must never be cached, or a
    # deploy can leave users pinned to a stale build referencing assets that
    # no longer exist.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
