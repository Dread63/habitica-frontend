server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check target for the Docker HEALTHCHECK.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets (Vite's default dist/assets/*) are immutable — cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every other path serves index.html and React Router
    # takes over client-side. index.html itself must never be cached, or a
    # deploy can leave users pinned to a stale build referencing assets that
    # no longer exist.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
